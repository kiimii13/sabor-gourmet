<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Sabor Gourmet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::selection { background: #d97706; color: white; }

    .hero-bg {
      background: radial-gradient(ellipse at 30% 50%, rgba(217,119,6,0.08) 0%, transparent 60%),
                  linear-gradient(135deg, #070604 0%, #0c0a09 60%, #111010 100%);
    }

    .grain::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 999;
      opacity: 0.4;
    }

    .gold-rule {
      height: 1px;
      background: linear-gradient(to right, transparent, #d97706, transparent);
    }

    .form-input {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(217,119,6,0.2);
      color: #fefdf8;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus {
      outline: none;
      border-color: #d97706;
      box-shadow: 0 0 0 3px rgba(217,119,6,0.1);
    }
    .form-input::placeholder { color: #57534e; }

    .btn-gold {
      background: linear-gradient(135deg, #d97706, #f59e0b);
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    }
    .btn-gold:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 32px rgba(217,119,6,0.4);
    }
    .btn-gold:disabled { opacity: 0.5; cursor: not-allowed; }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97) translateY(8px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .fade-in { animation: fadeIn 0.5s cubic-bezier(0.16,1,0.3,1) both; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-6px); }
      75%      { transform: translateX(6px); }
    }
    .shake { animation: shake 0.35s ease both; }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }
    .float-anim { animation: float 6s ease-in-out infinite; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spin { animation: spin 0.8s linear infinite; }
  </style>
</head>
<body class="grain hero-bg min-h-screen flex items-center justify-center p-6 font-sans" style="font-family: Inter, sans-serif;">

  <!-- Background decorative rings -->
  <div class="fixed inset-0 flex items-center justify-center pointer-events-none">
    <div class="w-[500px] h-[500px] rounded-full border border-amber-700/5"></div>
    <div class="absolute w-[800px] h-[800px] rounded-full border border-amber-700/4"></div>
  </div>

  <!-- Left decorative strip (desktop) -->
  <div class="hidden lg:flex fixed left-0 top-0 bottom-0 w-1 flex-col items-center justify-center space-y-6 py-8 opacity-30">
    <div class="flex-1 w-px bg-gradient-to-b from-transparent via-amber-600 to-transparent"></div>
  </div>

  <!-- Login Card -->
  <div class="fade-in relative z-10 w-full max-w-sm space-y-8">

    <!-- Brand -->
    <div class="text-center space-y-3 float-anim">
      <div class="w-14 h-14 rounded-xl border border-amber-600/40 flex items-center justify-center mx-auto bg-amber-600/5">
        <span class="text-amber-400 text-xl font-bold" style="font-family: Cinzel, serif;">SG</span>
      </div>
      <div>
        <h1 class="text-amber-400 text-sm tracking-[0.4em] uppercase font-medium" style="font-family: Cinzel, serif;">Sabor Gourmet</h1>
        <p class="text-stone-500 text-xs tracking-widest uppercase mt-1">Panel de Administración</p>
      </div>
    </div>

    <!-- Rule -->
    <div class="gold-rule opacity-40"></div>

    <!-- Card -->
    <div class="bg-stone-950/60 border border-amber-700/20 rounded-2xl p-8 backdrop-blur-sm shadow-2xl">

      <h2 class="text-stone-200 font-medium text-base mb-6 text-center tracking-wide">Acceso Restringido</h2>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">

        <div>
          <label class="block text-xs tracking-widest uppercase text-amber-500/70 mb-2">Usuario</label>
          <div class="relative">
            <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3.5 top-3.5 w-4 h-4 text-stone-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
            </svg>
            <input type="text" id="loginUser" autocomplete="username" placeholder="admin" required class="form-input w-full rounded-xl pl-10 pr-4 py-3 text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs tracking-widest uppercase text-amber-500/70 mb-2">Contraseña</label>
          <div class="relative">
            <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3.5 top-3.5 w-4 h-4 text-stone-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
            </svg>
            <input type="password" id="loginPass" autocomplete="current-password" placeholder="••••••••" required class="form-input w-full rounded-xl pl-10 pr-11 py-3 text-sm">
            <button type="button" id="togglePass" onclick="togglePassword()" class="absolute right-3.5 top-3.5 text-stone-500 hover:text-stone-300 transition-colors">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.964-7.178z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Error message -->
        <div id="loginError" class="hidden">
          <div class="flex items-center space-x-2 bg-red-950/50 border border-red-700/40 rounded-lg px-3 py-2.5">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-red-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
            </svg>
            <p id="loginErrorMsg" class="text-red-300 text-xs">Credenciales incorrectas.</p>
          </div>
        </div>

        <button type="submit" id="loginBtn" class="btn-gold w-full py-3.5 rounded-xl text-stone-900 font-semibold tracking-widest uppercase text-xs flex items-center justify-center space-x-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" id="loginBtnIcon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/>
          </svg>
          <span id="loginBtnText">Iniciar Sesión</span>
        </button>

      </form>

    </div>

    <!-- Back link -->
    <div class="text-center">
      <a href="/" class="inline-flex items-center space-x-2 text-stone-500 hover:text-amber-400 transition-colors text-xs tracking-widest uppercase">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
        </svg>
        <span>Volver al sitio</span>
      </a>
    </div>

    <!-- Credentials hint (dev only) -->
    <div class="text-center border border-amber-700/10 rounded-lg p-3 bg-amber-900/5">
      <p class="text-stone-500 text-[11px] font-mono">admin / saborgourmet2026</p>
      <p class="text-stone-600 text-[10px] mt-0.5">Credenciales de demostración</p>
    </div>

  </div>

  <script>
    // ===================== CHECK IF ALREADY LOGGED IN =====================
    if (sessionStorage.getItem('sg_admin_auth') === 'true') {
      window.location.href = '/admin.html';
    }

    // ===================== TOGGLE PASSWORD VISIBILITY =====================
    function togglePassword() {
      const input = document.getElementById('loginPass');
      const icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/>`;
      } else {
        input.type = 'password';
        icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.964-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>`;
      }
    }

    // ===================== LOGIN HANDLER =====================
    const CREDENTIALS = { username: 'admin', password: 'saborgourmet2026' };

    function handleLogin(e) {
      e.preventDefault();

      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value;
      const btn  = document.getElementById('loginBtn');
      const errorEl = document.getElementById('loginError');
      const form = document.getElementById('loginForm');

      // Loading state
      btn.disabled = true;
      document.getElementById('loginBtnIcon').outerHTML = `<svg id="loginBtnIcon" class="w-4 h-4 spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>`;
      document.getElementById('loginBtnText').textContent = 'Verificando...';

      // Simulate auth delay
      setTimeout(() => {
        if (user === CREDENTIALS.username && pass === CREDENTIALS.password) {
          // Success
          sessionStorage.setItem('sg_admin_auth', 'true');
          sessionStorage.setItem('sg_admin_user', user);
          document.getElementById('loginBtnText').textContent = 'Acceso concedido...';
          setTimeout(() => { window.location.href = '/admin.html'; }, 400);
        } else {
          // Error
          btn.disabled = false;
          errorEl.classList.remove('hidden');
          document.getElementById('loginError').classList.remove('hidden');
          document.getElementById('loginErrorMsg').textContent =
            user !== CREDENTIALS.username ? 'Usuario no reconocido.' : 'Contraseña incorrecta.';

          form.classList.add('shake');
          setTimeout(() => form.classList.remove('shake'), 400);

          // Reset button
          document.getElementById('loginBtnIcon').outerHTML = `<svg id="loginBtnIcon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/></svg>`;
          document.getElementById('loginBtnText').textContent = 'Iniciar Sesión';
        }
      }, 900);
    }
  </script>
</body>
</html>
